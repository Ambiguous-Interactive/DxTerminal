name: Unity Tests

# Licensed lifecycle adapted from Ambiguous-Interactive/DxAudio.
on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: "27 5 * * *"
  workflow_dispatch:
    inputs:
      capture_graphics:
        description: Run the Unity 6 graphics capture fixtures and retain screenshots
        type: boolean
        default: false

concurrency:
  group: unity-tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  runner-preflight:
    name: Self-hosted runner registration preflight
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        (github.event.pull_request.user.login != 'dependabot[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository)
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check licensed runner enrollment
        shell: bash
        env:
          ENABLED: ${{ vars.DXT_UNITY_CI_ENABLED }}
        run: |
          if [[ "$ENABLED" != true ]]; then
            echo '::error::Licensed execution is disabled. After organization enrollment and entitlement verification, set DXT_UNITY_CI_ENABLED=true.'
            exit 1
          fi

      - name: Require a registered Unity runner
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/check-unity-runner-availability@720ef47f9ab352fbc9403363ca63ae8c487a2442 # v1.18.1
        with:
          reader-app-id: ${{ secrets.BUILD_LOCK_READER_APP_ID }}
          reader-app-private-key: ${{ secrets.BUILD_LOCK_READER_APP_PRIVATE_KEY }}
          required-label-sets: '[["self-hosted","Windows","RAM-64GB"]]'

  unity-tests:
    name: Package tests (Unity ${{ matrix.unity-version }})
    needs: runner-preflight
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        (github.event.pull_request.user.login != 'dependabot[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository)
      }}
    runs-on: [self-hosted, Windows, RAM-64GB]
    timeout-minutes: 660
    strategy:
      fail-fast: false
      matrix:
        unity-version:
          - 2021.3.45f1
          - 2022.3.45f1
          - 6000.5.2f1
        exclude:
          - unity-version: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && '2021.3.45f1' || '' }}
          - unity-version: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && '2022.3.45f1' || '' }}
    steps:
      - name: Require current PR head before setup
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-current-pr-head@720ef47f9ab352fbc9403363ca63ae8c487a2442 # v1.18.1
        with:
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}

      - name: Require manually installed Unity editor
        id: ensure_unity_editor
        timeout-minutes: 10
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/ensure-unity-editor@720ef47f9ab352fbc9403363ca63ae8c487a2442 # v1.18.1
        with:
          unity-version: ${{ matrix.unity-version }}
          install-root: ${{ runner.tool_cache }}\u6-v3
          provisioning-profile: EditorOnly
          diagnostics-path: unity-editor-check.json
          ci-managed-only: true
          require-healthy-existing: true

      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up portable Python
        timeout-minutes: 5
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP "dxterminal-python-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $archive = "$work.zip"
          Invoke-WebRequest -Uri 'https://www.python.org/ftp/python/3.14.10/python-3.14.10-embed-amd64.zip' -OutFile $archive
          $expected = '90905e64a840557d8c1bc4f5b74db3d7ee85e3ffb217611cac1c7813acea4159'
          if ((Get-FileHash -Path $archive -Algorithm SHA256).Hash -ne $expected) {
            throw 'The Python archive SHA-256 does not match the python.org release.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $work
          Remove-Item -LiteralPath $archive
          & (Join-Path $work 'python.exe') --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $work

      - name: Set up Node for compatibility fixtures
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version: "24"

      - name: Set up .NET for the minimum supported Editor
        if: ${{ matrix.unity-version == '2021.3.45f1' }}
        timeout-minutes: 5
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Validate Unity license secrets
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/validate-unity-license@720ef47f9ab352fbc9403363ca63ae8c487a2442 # v1.18.1
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - name: Require current PR head before lock acquisition
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-current-pr-head@720ef47f9ab352fbc9403363ca63ae8c487a2442 # v1.18.1
        with:
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}

      - name: Acquire organization Unity lock
        id: acquire_lock
        timeout-minutes: 305
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/acquire-build-lock@720ef47f9ab352fbc9403363ca63ae8c487a2442 # v1.18.1
        with:
          lock-name: wallstop-organization-builds
          holder-id-suffix: ${{ matrix.unity-version }}-package
          require-resource-lifecycle: "true"
          minimum-release-cooldown-seconds: "0"
          runner-id: ${{ runner.name }}
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}
          timeout-minutes: "300"
        env:
          BUILD_LOCK_APP_ID: ${{ secrets.BUILD_LOCK_APP_ID }}
          BUILD_LOCK_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_APP_PRIVATE_KEY }}

      - name: Require acquired Unity lock
        if: ${{ steps.acquire_lock.outputs.acquired != 'true' }}
        timeout-minutes: 1
        shell: pwsh
        run: exit 1

      - name: Activate the runner seat
        timeout-minutes: 10
        shell: python
        env:
          UNITY_EDITOR_PATH: ${{ steps.ensure_unity_editor.outputs.editor-path }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          import os, pathlib, re, subprocess, tempfile, time
          for attempt in range(2):
              with tempfile.TemporaryDirectory(dir=os.environ["RUNNER_TEMP"]) as directory:
                  log = pathlib.Path(directory, "activation.log")
                  command = [os.environ["UNITY_EDITOR_PATH"], "-batchmode", "-nographics", "-quit",
                             "-createProject", str(pathlib.Path(directory, "project")), "-logFile", str(log),
                             "-serial", os.environ["UNITY_SERIAL"], "-username", os.environ["UNITY_EMAIL"],
                             "-password", os.environ["UNITY_PASSWORD"]]
                  child_env = {k: v for k, v in os.environ.items() if k not in {"UNITY_SERIAL", "UNITY_EMAIL", "UNITY_PASSWORD"}}
                  with subprocess.Popen(command, cwd=directory, env=child_env, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL) as editor:
                      try:
                          code = editor.wait(timeout=240)
                      except subprocess.TimeoutExpired:
                          subprocess.run(["taskkill", "/T", "/F", "/PID", str(editor.pid)], capture_output=True)
                          raise SystemExit("Unity activation timed out")
                  if code == 0:
                      break
                  diagnostic = log.read_text(encoding="utf-8", errors="replace") if log.is_file() else ""
                  transient = re.search(r"Licensing::[^\r\n]*(?:\b20111\b|maximum number of activations)", diagnostic, re.I)
                  if attempt or not transient or "20113" in diagnostic:
                      raise SystemExit(f"Unity activation failed (exit {code})")
              time.sleep(15)

      - name: Run package suites and requested compatibility fixtures
        # Two package suites plus two T13 profiles on Unity 6 need time to save failure reports.
        timeout-minutes: 255
        shell: pwsh
        env:
          UNITY_VERSION: ${{ matrix.unity-version }}
          UNITY_EDITOR_PATH: ${{ steps.ensure_unity_editor.outputs.editor-path }}
          FULL_MATRIX: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          CAPTURE_GRAPHICS: ${{ inputs.capture_graphics && matrix.unity-version == '6000.5.2f1' }}
        run: |
          $options = @()
          if ($env:FULL_MATRIX -eq 'true') {
            $legs = @{
              '2021.3.45f1' = @('unity-2021')
              '2022.3.45f1' = @('unity-2022')
              '6000.5.2f1' = @('unity-6', 'unity-6-no-reload')
            }
            foreach ($leg in $legs[$env:UNITY_VERSION]) { $options += @('--t13', $leg) }
          }
          if ($env:CAPTURE_GRAPHICS -eq 'true') { $options += '--graphics' }
          $report = Join-Path $env:RUNNER_TEMP "dxterminal-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$env:UNITY_VERSION"
          python tooling~/scripts/unity/package_tests.py --unity $env:UNITY_EDITOR_PATH --version $env:UNITY_VERSION --out $report @options
          exit $LASTEXITCODE

      - name: Upload package test evidence
        if: ${{ always() && !cancelled() && steps.acquire_lock.outputs.acquired == 'true' }}
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unity-${{ matrix.unity-version }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dxterminal-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.unity-version }}
          if-no-files-found: error
          retention-days: 14

      - name: Check compatibility and render API documentation with the 2021 Editor assemblies
        if: ${{ matrix.unity-version == '2021.3.45f1' }}
        timeout-minutes: 15
        shell: pwsh
        env:
          UNITY_EDITOR_PATH: ${{ steps.ensure_unity_editor.outputs.editor-path }}
        run: |
          $env:UNITY_EDITOR_MANAGED = Join-Path (Split-Path $env:UNITY_EDITOR_PATH) 'Data/Managed/UnityEngine'
          npm run compat:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build 'tooling~/compat/tests/tests-2021.3.csproj' -c Release --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run docs:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix tooling~ run lint:docs-catalog
          exit $LASTEXITCODE

      - name: Upload the rendered API documentation
        if: ${{ matrix.unity-version == '2021.3.45f1' }}
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: tooling~/docs/obj/_site
          if-no-files-found: error

      - name: Require current PR head after Unity validation
        if: ${{ github.event_name == 'pull_request' }}
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-current-pr-head@720ef47f9ab352fbc9403363ca63ae8c487a2442 # v1.18.1
        with:
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}

      - name: Return Unity license
        id: return_unity_license
        if: ${{ always() && steps.acquire_lock.outputs.acquired == 'true' }}
        timeout-minutes: 5
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/return-unity-license@720ef47f9ab352fbc9403363ca63ae8c487a2442 # v1.18.1
        with:
          unity-version: ${{ matrix.unity-version }}
          tool-cache: ${{ runner.tool_cache }}
          unity-email: ${{ secrets.UNITY_EMAIL }}
          unity-password: ${{ secrets.UNITY_PASSWORD }}
          evidence-suffix: unity-tests-package

      - name: Classify Unity cleanup evidence
        id: cleanup_classification
        if: ${{ always() && steps.acquire_lock.outputs.acquired == 'true' }}
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/classify-unity-cleanup-evidence@720ef47f9ab352fbc9403363ca63ae8c487a2442 # v1.18.1
        with:
          return-log-path: ${{ steps.return_unity_license.outputs.return-log-path }}
          return-command-completed: ${{ steps.return_unity_license.outputs.return-command-completed }}
          return-exit-code: ${{ steps.return_unity_license.outputs.return-exit-code }}
          evidence-capture-complete: ${{ steps.return_unity_license.outputs.evidence-capture-complete }}
          return-log-digest: ${{ steps.return_unity_license.outputs.return-log-digest }}

      - name: Release organization Unity lock
        id: release_unity_lock
        if: always()
        timeout-minutes: 5
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/release-build-lock@720ef47f9ab352fbc9403363ca63ae8c487a2442 # v1.18.1
        with:
          lock-name: wallstop-organization-builds
          holder-id-suffix: ${{ matrix.unity-version }}-package
          runner-id: ${{ runner.name }}
          resource-cleanup-status: ${{ steps.cleanup_classification.outputs.resource-cleanup-status }}
          resource-health: ${{ steps.cleanup_classification.outputs.resource-health }}
          resource-reason: ${{ steps.cleanup_classification.outputs.resource-reason }}
        env:
          BUILD_LOCK_APP_ID: ${{ secrets.BUILD_LOCK_APP_ID }}
          BUILD_LOCK_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_APP_PRIVATE_KEY }}

      - name: Require confirmed Unity cleanup
        if: always()
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-confirmed-unity-cleanup@720ef47f9ab352fbc9403363ca63ae8c487a2442 # v1.18.1
        with:
          acquired: ${{ steps.acquire_lock.outputs.acquired }}
          classification-complete: ${{ steps.cleanup_classification.outputs.classification-complete }}
          cleanup-status: ${{ steps.cleanup_classification.outputs.resource-cleanup-status }}
          cleanup-health: ${{ steps.cleanup_classification.outputs.resource-health }}
          cleanup-reason: ${{ steps.cleanup_classification.outputs.resource-reason }}
          release-outcome: ${{ steps.release_unity_lock.outcome }}
          cleanup-result: ${{ steps.release_unity_lock.outputs.cleanup-result }}
          released: ${{ steps.release_unity_lock.outputs.released }}
          release-health: ${{ steps.release_unity_lock.outputs.resource-health }}
          release-reason: ${{ steps.release_unity_lock.outputs.resource-reason }}
          reservation-state: ${{ steps.release_unity_lock.outputs.reservation-state }}
          reservation-id: ${{ steps.release_unity_lock.outputs.reservation-id }}
          incident-id: ${{ steps.release_unity_lock.outputs.incident-id }}

  unity-ci-success:
    name: Unity CI Success
    needs:
      - runner-preflight
      - unity-tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify Unity CI result shape
        shell: bash
        env:
          RUNNER_PREFLIGHT_RESULT: ${{ needs.runner-preflight.result }}
          UNITY_TESTS_RESULT: ${{ needs.unity-tests.result }}
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name !=
            github.repository }}
          DEPENDABOT_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' }}
        run: |
          set -euo pipefail
          if [ "${FORK_PR}" = "true" ] || [ "${DEPENDABOT_PR}" = "true" ]; then
            test "${RUNNER_PREFLIGHT_RESULT}" = skipped
            test "${UNITY_TESTS_RESULT}" = skipped
          else
            test "${RUNNER_PREFLIGHT_RESULT}" = success
            test "${UNITY_TESTS_RESULT}" = success
          fi
