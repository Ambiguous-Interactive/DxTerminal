name: Docs Build

# Guide previews build on ordinary hosted runners. The licensed 2021.3
# job builds the complete API site, validates xrefs, and retains docs-site.
on:
  push:
    branches:
      - master
      - main
    paths:
      - "global.json"
      - "Documentation~/**"
      - "Samples~/**"
      - "Runtime/**"
      - "Tests/Runtime/Capture/Baselines~/**"
      - "tooling~/docs/**"
      - "tooling~/scripts/t11/**"
      - "tooling~/package.json"
      - "package.json"
      - ".config/dotnet-tools.json"
      - ".gitattributes"
      - ".npmrc"
      - "tooling~/.npmrc"
      - ".github/workflows/docs-build.yml"
  pull_request:
    paths:
      - "global.json"
      - "Documentation~/**"
      - "Samples~/**"
      - "Runtime/**"
      - "Tests/Runtime/Capture/Baselines~/**"
      - "tooling~/docs/**"
      - "tooling~/scripts/t11/**"
      - "tooling~/package.json"
      - "package.json"
      - ".config/dotnet-tools.json"
      - ".gitattributes"
      - ".npmrc"
      - "tooling~/.npmrc"
      - ".github/workflows/docs-build.yml"
  workflow_dispatch:
    inputs:
      licensed_run_id:
        description: Successful Unity Tests run at this commit containing docs-site (for Pages deployment)
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs-build:
    name: docs-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-docfx-${{ hashFiles('global.json', '.config/dotnet-tools.json') }}
          restore-keys: ${{ runner.os }}-nuget-docfx-

      - name: Build guide preview
        run: npm --prefix tooling~ run docs:guides

      - name: Lint docs catalog and guide links
        run: npm --prefix tooling~ run lint:docs-catalog

      - name: Upload the site preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-guides
          path: tooling~/docs/obj/_site
          if-no-files-found: error

      - name: Fetch the verified full site for Pages
        if: github.event_name == 'workflow_dispatch' && github.repository == 'wallstop/DxCommandTerminal' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.licensed_run_id }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" | jq -e --arg sha "$GITHUB_SHA" '
            .head_sha == $sha and .head_branch == "master" and .conclusion == "success"
            and (.event == "schedule" or .event == "workflow_dispatch")
            and .path == ".github/workflows/unity-tests.yml"'
          gh run download "$RUN_ID" -n docs-site -D "$RUNNER_TEMP/full-docs"
          test -s "$RUNNER_TEMP/full-docs/api/WallstopStudios.DxCommandTerminal.Backend.Terminal.html"

      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch' && github.repository == 'wallstop/DxCommandTerminal' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/full-docs

  deploy:
    name: deploy Pages
    if: github.event_name == 'workflow_dispatch' && github.repository == 'wallstop/DxCommandTerminal' && github.ref == 'refs/heads/master'
    needs: docs-build
    environment: github-pages
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
