name: Compat 2021

# Keep the existing required check name while running the standalone NUnit
# host on every qualifying change. The 2021.3 compatibility compiles run in
# unity-tests.yml with that editor's installed reference assemblies.
on:
  push:
    branches:
      - master
      - main
    paths:
      - "global.json"
      - "Runtime/**"
      - "Tests/Editor/**"
      - "Generator~/**"
      - "tooling~/compat/**"
      - "tooling~/package.json"
      - "package.json"
      - ".github/workflows/compat-2021.yml"
      - ".gitattributes"
      - ".npmrc"
      - "tooling~/.npmrc"
  pull_request:
    paths:
      - "global.json"
      - "Runtime/**"
      - "Tests/Editor/**"
      - "Generator~/**"
      - "tooling~/compat/**"
      - "tooling~/package.json"
      - "package.json"
      - ".github/workflows/compat-2021.yml"
      - ".gitattributes"
      - ".npmrc"
      - "tooling~/.npmrc"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compat-2021:
    name: compat-2021
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-logic-${{ hashFiles('global.json', 'tooling~/compat/testhost/testhost.csproj', 'Generator~/WallstopStudios.DxCommandTerminal.SourceGenerators/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-logic-

      - name: Run engine-independent fixtures
        run: npm run test:logic
