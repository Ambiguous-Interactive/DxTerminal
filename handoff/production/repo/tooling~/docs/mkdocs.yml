site_name: DxTerminal
site_description: In-game console for Unity. Typed commands, Actions, watches, and per-build control.
site_url: https://ambiguous-interactive.github.io/DxTerminal/
repo_url: https://github.com/Ambiguous-Interactive/DxTerminal
repo_name: Ambiguous-Interactive/DxTerminal
docs_dir: ../../Documentation~
site_dir: ../../site
strict: true

theme:
  name: material
  custom_dir: overrides
  logo: assets/brand/dxterminal-mark.svg
  favicon: assets/brand/dxterminal-favicon.svg
  font: false
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["../../Documentation~"]
      check_paths: true

nav:
  - Get started:
      - Install: install.md
      - First command: first-command.md
      - Open the terminal: open.md
  - Guides:
      - Commands: commands.md
      - Arguments: arguments.md
      - Completion: completion.md
      - Actions: actions.md
      - Watches: watches.md
      - Build profiles: build-profiles.md
      - Themes: themes.md
      - Touch and gamepad: touch-and-gamepad.md
  - Reference:
      - Built-in commands: builtins.md
      - Settings: settings.md
      - Migrating to 1.0: migration.md
      - Performance: performance.md
      - Lifetime: lifecycle.md
      - Source generator: generator.md
  - API: api/index.html
  - Changelog: changelog.md
